<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept B — Showroom · Car Zone</title>
<style>
:root{
  --blue:hsl(219,69%,56%);
  --title:hsl(219,8%,97%); --text:hsl(219,8%,72%); --dim:hsl(219,4%,48%);
  --body:hsl(219,4%,3%);
  --font:"Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--body);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

.flag{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;gap:14px;align-items:center;
  padding:9px 24px;background:var(--blue);color:#fff;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.flag span{opacity:.82;text-transform:none;letter-spacing:.02em;font-weight:400}
.flag a{margin-left:auto;border-bottom:1px solid rgba(255,255,255,.5)}

.logo{position:fixed;top:58px;left:26px;z-index:70;font-weight:700;letter-spacing:.24em;font-size:.78rem;color:var(--title);mix-blend-mode:difference}

/* ── contorul lateral, ca la Maserati ── */
.counter{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:70;
  display:flex;flex-direction:column;align-items:flex-end;gap:12px;font-variant-numeric:tabular-nums}
.counter .now{color:var(--title);font-size:1.5rem;font-weight:600;letter-spacing:-.03em}
.counter .track{width:1px;height:118px;background:hsl(219,6%,18%);position:relative;overflow:hidden}
.counter .fill{position:absolute;top:0;left:0;width:100%;background:var(--blue);transition:height .25s ease}
.counter .all{color:var(--dim);font-size:.72rem}

.hint{position:fixed;bottom:22px;left:26px;z-index:70;color:var(--dim);font-size:.66rem;
  letter-spacing:.18em;text-transform:uppercase}

/* ── o masina = un ecran ── */
.car{position:relative;height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;
  padding:0 clamp(26px,6vw,90px);overflow:hidden}
.car::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 82% 50%, rgba(60,110,220,.07), transparent 55%)}

.media{position:absolute;inset:0;z-index:0}
.media img{width:100%;height:100%;object-fit:cover;object-position:center;
  transform:scale(1.06);transition:transform 1.6s cubic-bezier(.22,1,.36,1);filter:brightness(.62)}
.car.live .media img{transform:scale(1)}
/* Scrim-ul trebuie sa tina textul lizibil peste orice fotografie, inclusiv
   peste una deschisa la stanga. De aceea e opac pana dupa jumatate. */
.media::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(3,4,6,.97) 0%,rgba(3,4,6,.9) 34%,rgba(3,4,6,.6) 58%,rgba(3,4,6,.25) 100%)}

.copy{position:relative;z-index:2;max-width:640px;
  opacity:0;transform:translateY(26px);transition:opacity .7s ease .1s,transform .7s cubic-bezier(.22,1,.36,1) .1s}
.car.live .copy{opacity:1;transform:none}

.idx{color:var(--blue);font-size:.66rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.make{margin-top:20px;color:var(--dim);font-size:.86rem;letter-spacing:.2em;text-transform:uppercase}
.model{margin-top:6px;color:var(--title);font-size:clamp(2.9rem,6.4vw,6.2rem);font-weight:600;
  line-height:.93;letter-spacing:-.05em}
.line{margin-top:26px;width:56px;height:2px;background:var(--blue)}

.stats{display:flex;gap:clamp(26px,4vw,58px);margin-top:30px;flex-wrap:wrap}
.stats div{font-variant-numeric:tabular-nums}
.stats b{display:block;color:var(--title);font-size:clamp(1.3rem,2.1vw,1.9rem);font-weight:600;letter-spacing:-.025em}
.stats span{display:block;margin-top:5px;color:var(--dim);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase}

.foot{display:flex;align-items:center;gap:26px;margin-top:40px;flex-wrap:wrap}
.price{color:var(--title);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cta{padding:13px 26px;border:1px solid rgba(255,255,255,.28);border-radius:40px;
  color:var(--title);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  transition:background .2s,border-color .2s}
.cta:hover{background:var(--title);border-color:var(--title);color:#06080c}
.cta.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.cta.solid:hover{background:#fff;border-color:#fff;color:#06080c}

.intro{height:100vh;display:grid;place-items:center;text-align:center;padding:0 26px}
.intro h1{color:var(--title);font-size:clamp(2.6rem,7vw,6.4rem);font-weight:600;line-height:.95;letter-spacing:-.05em}
.intro p{margin-top:24px;max-width:520px;color:var(--text);font-size:1.02rem;line-height:1.75}
.intro .idx{margin-bottom:22px}

@media(max-width:900px){
  .car{grid-template-columns:1fr;align-content:end;padding-bottom:96px}
  .media::after{background:linear-gradient(180deg,rgba(3,4,6,.42) 0%,rgba(3,4,6,.92) 68%)}
  .counter{display:none}
}
</style>
</head>
<body>

<div class="flag">Concept B — Showroom
  <span>directia Maserati / AKQA: o masina pe ecran, narativ pe scroll, zero chrome</span>
  <a href="concept-inventar.html">Vezi conceptul A →</a>
</div>

<div class="logo">CAR ZONE</div>

<div class="counter">
  <div class="now" id="now">00</div>
  <div class="track"><div class="fill" id="fill" style="height:0"></div></div>
  <div class="all" id="all">00</div>
</div>

<p class="hint">Scroll</p>

<section class="intro">
  <div>
    <p class="idx">Curated inventory</p>
    <h1>Fiecare masina,<br>o singura data.</h1>
    <p>Nu o grila de rezultate. Un sir de masini, fiecare cu ecranul ei, in ordinea in care merita privite.</p>
  </div>
</section>

<main id="stage"></main>

<script>
const num = s => Number(String(s ?? '').replace(/[^0-9.]/g,'')) || 0;
const eur = n => '€' + n.toLocaleString('en-US');

fetch('assets/data/cars.json').then(r => r.json()).then(data => {
  // Showroom-ul nu e un catalog: intai cele mai puternice, ca sirul sa aiba o curba.
  const cars = Object.entries(data)
    .map(([id,c]) => ({ id, ...c, hp:num(c.power), pr:num(c.price) }))
    .sort((a,b) => b.hp - a.hp);

  document.getElementById('all').textContent = String(cars.length).padStart(2,'0');

  document.getElementById('stage').innerHTML = cars.map((c,i) => `
    <section class="car" data-i="${i+1}">
      <div class="media"><img src="${(c.images && c.images[0]) || c.image}"
        alt="${c.make} ${c.model}" loading="lazy" decoding="async"></div>
      <div class="copy">
        <p class="idx">${String(i+1).padStart(2,'0')} / ${cars.length}</p>
        <p class="make">${c.make}</p>
        <h2 class="model">${c.model}</h2>
        <div class="line"></div>
        <div class="stats">
          <div><b>${c.hp}</b><span>Cai putere</span></div>
          <div><b>${c.year}</b><span>An</span></div>
          <div><b>${num(c.km).toLocaleString('en-US')}</b><span>Kilometri</span></div>
          <div><b>${c.fuel}</b><span>Combustibil</span></div>
        </div>
        <div class="foot">
          <p class="price">${eur(c.pr)}</p>
          <a class="cta solid">Vezi masina</a>
          <a class="cta">Programeaza vizionare</a>
        </div>
      </div>
    </section>`).join('');

  // Zona activa e banda din mijlocul ecranului, nu un prag de vizibilitate:
  // cu prag, intre doua sectiuni niciuna nu trece de el si textul ramane ascuns.
  const now = document.getElementById('now'), fill = document.getElementById('fill');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      e.target.classList.toggle('live', e.isIntersecting);
      if (e.isIntersecting){
        const i = Number(e.target.dataset.i);
        now.textContent = String(i).padStart(2,'0');
        fill.style.height = (i / cars.length * 100) + '%';
      }
    });
  }, { rootMargin: '-35% 0px -35% 0px', threshold: 0 });
  document.querySelectorAll('.car').forEach(s => io.observe(s));
});
</script>
</body>
</html>
